{% extends "base.html" %}
{% block title %}Login — Career GPS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="cg-card">
      <h4 class="mb-3">Log in</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-1">No account? <a href="{{ url_for('register') }}">Register</a></p>
      <p class="text-center mb-0"><a href="{{ url_for('demo_login') }}">Or try the demo account →</a></p>
    </div>
  </div>
</div>
{% endblock %}
